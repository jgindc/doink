[project]
name = "swingbot"
version = "0.1.0"
description = "Research-first swing-trading system (crypto + ETFs), paper trading only."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyarrow>=16",
    "pyyaml>=6",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["swingbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
