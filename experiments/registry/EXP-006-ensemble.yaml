id: EXP-006
title: Ensemble of the three sleeves with a-priori default parameters, crypto book
registered: 2026-10-11
kind: fixed
hypothesis: >
  A fixed, untuned combination of the three default sleeves (1/3 budget each), per-asset caps and a 40% annual
  vol target beats all three benchmarks on Sharpe with a much smaller drawdown, after costs.
prior: >
  The most likely sleeve to carry the ensemble is trend. Equal capital budgets leave the book partly in cash
  (dip sleeve is mostly flat), which lowers CAGR versus buy-and-hold; Sharpe and drawdown are the real test.
config:
  sleeves:
    trend: {lookbacks: [20, 60, 120, 250], signal: return_sign, vol_lookback: 60}
    rotation: {lookbacks: [30, 60, 90], top_n: 2, rebalance_days: 7, vol_lookback: 60}
    dip: {rsi_len: 2, entry: 10, exit_sma: 5, trend_sma: 200, time_stop: 10, vol_lookback: 60}
  portfolio: from configs/crypto.yaml (budgets 1/3, caps BTC/ETH 0.5 others 0.2, vol target 0.40, band 0.02)
diagnostic_variants:
  - no_vol_target   # same book without the vol target; informational, counted as a trial, not promotable
n_trials: 2
data: {book: crypto, universe: main, research_end: "2024-09-30"}
simulation: {start: "2016-01-01", band: 0.02, costs: base}
periods:
  full: ["2016-01-01", "2024-09-30"]
  oos: ["2018-12-31", "2024-09-30"]   # gates evaluated here, same dates as the sleeve walk-forwards
gates: [G1, G2, G3, G4, G5, G7, G9]   # G6/G8 not applicable (no grid)
dsr: {n_trials: 29, note: "V[SR] across all 27 sleeve grid configs over OOS dates"}
promotion: >
  If all gates pass: independent critic review, then open the locked holdout once (logged), then paper trading.
